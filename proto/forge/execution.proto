syntax = "proto3";
package forge.execution;

service ExecutionService {
  rpc CreateSandbox(CreateSandboxRequest) returns (Sandbox);
  rpc Execute(ExecuteRequest) returns (ExecuteResponse);
  rpc DestroySandbox(DestroySandboxRequest) returns (Empty);
}

message Empty {}

message CreateSandboxRequest {
  string project_id = 1;
  string tier = 2;
  ResourceLimits limits = 3;
}

message ResourceLimits {
  int32 max_memory_mb = 1;
  float max_cpu_cores = 2;
  int32 max_disk_mb = 3;
  int32 timeout_seconds = 4;
  bool network_enabled = 5;
}

message Sandbox {
  string id = 1;
  string project_id = 2;
  string tier = 3;
  string status = 4;
}

message ExecuteRequest {
  string sandbox_id = 1;
  string command = 2;
  string working_dir = 3;
  map<string, string> env = 4;
}

message ExecuteResponse {
  string sandbox_id = 1;
  int32 exit_code = 2;
  string stdout = 3;
  string stderr = 4;
  int64 duration_ms = 5;
}

message DestroySandboxRequest {
  string sandbox_id = 1;
}
