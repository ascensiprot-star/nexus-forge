syntax = "proto3";
package forge.agent;

service AgentService {
  rpc AssignTask(AssignTaskRequest) returns (AssignTaskResponse);
  rpc GetAgentStatus(GetAgentStatusRequest) returns (AgentStatus);
  rpc ListAgents(ListAgentsRequest) returns (AgentList);
  rpc EscalateTask(EscalateRequest) returns (EscalateResponse);
}

message AssignTaskRequest {
  string task_id = 1;
  string agent_role = 2;
  string context = 3;
}

message AssignTaskResponse {
  string agent_id = 1;
  string status = 2;
}

message GetAgentStatusRequest {
  string agent_id = 1;
}

message AgentStatus {
  string agent_id = 1;
  string role = 2;
  string status = 3;
  string current_task_id = 4;
  int32 tasks_completed = 5;
}

message ListAgentsRequest {}

message AgentList {
  repeated AgentStatus agents = 1;
}

message EscalateRequest {
  string task_id = 1;
  string agent_id = 2;
  string reason = 3;
}

message EscalateResponse {
  string new_agent_id = 1;
  string escalation_id = 2;
}
